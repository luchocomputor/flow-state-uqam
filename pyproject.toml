[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flowstate"
version = "0.1.0"
description = "EEG decoding of in-game attentional engagement: multivariate EMD, Wigner-Ville and Riemannian features"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Louis Almairac" }]
keywords = ["EEG", "empirical mode decomposition", "Wigner-Ville", "Riemannian geometry", "brain-computer interface"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3", "pyriemann>=0.6", "joblib>=1.3"]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebook = ["matplotlib>=3.7", "jupyter"]

[project.urls]
Repository = "https://github.com/luchocomputor/flow-state-uqam"
Issues = "https://github.com/luchocomputor/flow-state-uqam/issues"

[tool.setuptools.packages.find]
where = ["src"]
